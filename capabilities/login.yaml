capability_id: login
goal: >
  Log in with username '${PARABANK_USERNAME}' and password '${PARABANK_PASSWORD}'.
  When calling done, include output keys 'login_succeeded' and 'message'.
# url: https://parabank.parasoft.com/parabank/index.htm
url: ${PARABANK_BASE_URL}/parabank/index.htm
params:
  ${PARABANK_USERNAME}: username
  ${PARABANK_PASSWORD}: password
outputs: [login_succeeded, message]
checkpoint:
  kind: url_contains
  expected: /overview.htm
outcome_rules:
  - name: invalid_credentials
    kind: text_visible
    expected: could not be verified